<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CropCare · History</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .cc-glass-search {
    background: rgba(251, 249, 241, 0.74);
    border-bottom: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 8px 24px rgba(35, 75, 56, 0.1);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
</style>
</head>
<body>
<div class="phone">
  <header class="header cc-glass-search"><strong style="font-size:20px">Scan History</strong><button class="icon-btn" aria-label="Search"><svg class="icon"><use href="../shared/icons.svg#history"></use></svg></button></header>
  <div class="section" style="padding-top:0">
    <div class="card"><span class="status-pill"><svg class="icon"><use href="../shared/icons.svg#check"></use></svg> Healthy</span><h3 style="margin-top:10px">Pechay</h3><p class="muted">Today · 94% confidence</p></div>
    <div class="card"><span class="status-pill" style="background:var(--status-warning-surface);color:var(--status-warning-text)"><svg class="icon"><use href="../shared/icons.svg#alert"></use></svg> Needs attention</span><h3 style="margin-top:10px">Tomato</h3><p class="muted">3 days ago · Leaf spots</p></div>
    <div class="card"><span class="status-pill"><svg class="icon"><use href="../shared/icons.svg#check"></use></svg> Healthy</span><h3 style="margin-top:10px">Rice</h3><p class="muted">Last week · 91% confidence</p></div>
  </div>
</div>
<nav class="nav" aria-label="Primary">
  <a href="../home/index.html"><svg class="icon"><use href="../shared/icons.svg#home"></use></svg><span>Home</span></a>

</nav>

</html>
