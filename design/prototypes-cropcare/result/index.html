<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CropCare · Scan Result</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .cc-glass-status {
    background: rgba(251, 249, 241, 0.74);
    border: 1px solid rgba(255, 255, 255, 0.62);
    box-shadow: 0 8px 24px rgba(35, 75, 56, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.6);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
</style>
</head>
<body>
<div class="phone">
  <header class="header">
    <button class="ghost" type="button">Back</button>
    <strong>Scan Result</strong>
    <button class="icon-btn" aria-label="Share"><svg class="icon"><use href="../shared/icons.svg#arrow"></use></svg></button>
  </header>

  <div class="card cc-glass-status">
    <span class="status-pill"><svg class="icon"><use href="../shared/icons.svg#check"></use></svg> Healthy</span>
    <h1 style="font-size:24px;margin-top:12px">No disease detected</h1>
    <p class="muted" style="margin-top:6px">Pechay · scanned today</p>
    <div style="display:flex;align-items:baseline;gap:8px;margin-top:16px"><span class="confidence">94%</span><span class="muted">confidence</span></div>
  </div>

  <section class="section">
    <h2>What to do next</h2>
    <div class="card"><h3>Keep watering in the morning</h3><p class="muted">Check the soil before the next irrigation.</p></div>
    <div class="card"><h3>Watch for new spots</h3><p class="muted">Scan again in seven days or earlier if leaves change.</p></div>
  </section>

  <button class="primary">Save to Health Log</button>
  <button class="ghost" style="display:block;margin:0 24px;width:calc(100% - 48px)">Scan again</button>
</div>
<nav class="nav" aria-label="Primary">
  <a href="../home/index.html"><svg class="icon"><use href="../shared/icons.svg#home"></use></svg><span>Home</span></a>
  <a href="../scan/index.html"><svg class="icon"><use href="../shared/icons.svg#scan"></use></svg><span>Scan</span></a>
  <a class="active" href="../history/index.html"><svg class="icon"><use href="../shared/icons.svg#history"></use></svg><span>History</span></a>
  <a href="../profile/index.html"><svg class="icon"><use href="../shared/icons.svg#profile"></use></svg><span>Profile</span></a>
</nav>
</body>
</html>
