<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CropCare · Scan</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .cc-glass-capture {
    padding: 12px;
    border-radius: var(--radius-lg);
    background: rgba(23, 53, 38, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow: 0 8px 24px rgba(35, 75, 56, 0.16);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  .cc-glass-capture .ghost {
    background: rgba(251, 249, 241, 0.14);
    border-color: rgba(255, 255, 255, 0.35);
    color: var(--text-inverse);
  }
  .cc-glass-capture .shutter { border-color: rgba(251, 249, 241, 0.9); }
</style>
</head>
<body>
<div class="phone">
  <header class="header">
    <button class="ghost" type="button">Cancel</button>
    <strong>Scan Crop</strong>
    <span class="status-pill">Rice</span>
  </header>
  <div class="viewfinder">
    <div class="frame-guide"></div>
    <div class="viewfinder-hint">Fill the frame with the affected leaf</div>
  </div>
  <div class="capture-row cc-glass-capture">
    <button class="ghost" type="button">Import</button>
    <button class="shutter" aria-label="Capture photo"></button>
    <button class="ghost" type="button">Flash</button>
  </div>
  <div class="card"><p class="muted">Hold steady. A clear photo gives a more useful diagnosis.</p></div>
</div>
<nav class="nav" aria-label="Primary">
  <a href="../home/index.html"><svg class="icon"><use href="../shared/icons.svg#home"></use></svg><span>Home</span></a>
  <a class="active" href="../scan/index.html"><svg class="icon"><use href="../shared/icons.svg#scan"></use></svg><span>Scan</span></a>
  <a href="../history/index.html"><svg class="icon"><use href="../shared/icons.svg#history"></use></svg><span>History</span></a>
  <a href="../profile/index.html"><svg class="icon"><use href="../shared/icons.svg#profile"></use></svg><span>Profile</span></a>
</nav>
</body>
</html>
